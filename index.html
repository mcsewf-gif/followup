<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Follow Up 提醒</title>
  <style>
    :root {
      --primary-color: #5b4fe1;
      --bg-color: #f4f5f9;
      --card-completed-bg: #d1f2d9;
      --card-completed-border: #a3e6b5;
      --card-due-bg: #fcd7d7;
      --card-due-border: #f8b4b4;
      --card-upcoming-bg: #fef0b3;
      --card-upcoming-border: #fce182;
      --card-future-bg: #e2e8f0;
      --card-future-border: #cbd5e1;
      --btn-secondary-bg: #e0e7ff;
      --btn-secondary-color: #4338ca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-color);
      min-height: 92vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 18px 15px;
      font-size: 20px;
      font-weight: bold;
    }

    /* 顶部导航 Tabs */
    .nav-tabs {
      display: flex;
      background-color: white;
      margin: 12px;
      padding: 4px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: bold;
      color: #666;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    /* 视图切换容器 */
    .view-content {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    .view-content.active {
      display: flex;
    }

    /* --- 1. Follow Up 列表视图 --- */
    .input-section {
      display: flex;
      gap: 8px;
      padding: 0 12px 12px 12px;
    }

    .task-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      background: white;
    }

    .add-btn {
      background-color: #48bb78;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .task-list {
      padding: 0 12px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .task-card {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .task-card.completed {
      background-color: var(--card-completed-bg);
      border-color: var(--card-completed-border);
      opacity: 0.85;
    }

    .task-card.due-today {
      background-color: var(--card-due-bg);
      border-color: var(--card-due-border);
    }

    .task-card.upcoming {
      background-color: var(--card-upcoming-bg);
      border-color: var(--card-upcoming-border);
    }

    .drag-handle {
      color: #888;
      font-size: 12px;
      cursor: grab;
      user-select: none;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-right: 4px;
    }

    /* 缩小 2 号字体 (原16px调整为14px) */
    .task-title {
      font-size: 14px; 
      font-weight: bold;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: #555;
    }

    .task-sub {
      font-size: 11px;
      color: #4a5568;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.7;
      padding: 2px;
    }

    .done-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .task-card.completed .done-btn {
      background-color: #2f855a;
    }

    /* --- 2. 月视图 (Month View) --- */
    .month-view-container {
      padding: 0 12px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 月份翻页与按钮导航栏 */
    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      gap: 6px;
    }

    .month-title {
      font-size: 16px;
      font-weight: bold;
      color: #1a1a1a;
      min-width: 100px;
      text-align: center;
    }

    .month-btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .month-nav-btn {
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-color);
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .month-nav-btn:hover {
      background-color: #d0d7fe;
    }

    .month-nav-btn.today-btn {
      background-color: var(--primary-color);
      color: white;
    }

    .month-nav-btn.today-btn:hover {
      opacity: 0.9;
    }

    /* 日历表格样式 */
    .calendar-board {
      background: white;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .week-headers {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .week-header-cell {
      background-color: #f0f2f8;
      color: #3b4261;
      text-align: center;
      padding: 6px 0;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .day-cell {
      background-color: #f8f9fa;
      border-radius: 8px;
      min-height: 62px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .day-cell.empty {
      background-color: transparent;
    }

    .day-cell.is-today {
      border: 1.5px solid var(--primary-color);
    }

    .day-number {
      font-size: 12px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    .calendar-tag {
      font-size: 9px;
      padding: 2px 4px;
      border-radius: 4px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      line-height: 1.2;
    }

    .calendar-tag.tag-due {
      background-color: #e53e3e;
    }

    .calendar-tag.tag-completed {
      background-color: #38a169;
    }

    .calendar-tag.tag-upcoming {
      background-color: #dd6b20;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>Work Follow Up 提醒</header>

  <!-- 顶部 Tab 切换 -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('followUp')">Follow Up</button>
    <button class="tab-btn" onclick="switchTab('week')">周视图</button>
    <button class="tab-btn" onclick="switchTab('month')">月视图</button>
    <button class="tab-btn" onclick="switchTab('year')">年视图</button>
  </div>

  <!-- 1. Follow Up 视图 -->
  <div id="followUpView" class="view-content active">
    <div class="input-section">
      <input type="text" id="newTaskInput" class="task-input" placeholder="事项名称..." />
      <button class="add-btn" onclick="addNewTask()">添 加</button>
    </div>

    <div class="task-list" id="taskList">
      <!-- 动态渲染列表 -->
    </div>
  </div>

  <!-- 2. 月视图 -->
  <div id="monthView" class="view-content">
    <div class="month-view-container">
      <!-- 月份切换栏：在 上个月 和 下个月 中间增加了【本月】按钮 -->
      <div class="month-header">
        <button class="month-nav-btn" onclick="changeMonth(-1)">◀ 上个月</button>
        <button class="month-nav-btn today-btn" onclick="resetToCurrentMonth()">本月</button>
        <span class="month-title" id="monthDisplayTitle">2026 年 09 月</span>
        <button class="month-nav-btn" onclick="changeMonth(1)">下个月 ▶</button>
      </div>

      <!-- 日历板块 -->
      <div class="calendar-board">
        <div class="week-headers">
          <div class="week-header-cell">一</div>
          <div class="week-header-cell">二</div>
          <div class="week-header-cell">三</div>
          <div class="week-header-cell">四</div>
          <div class="week-header-cell">五</div>
        </div>
        <div class="days-grid" id="calendarDaysGrid">
          <!-- 动态渲染月度日历网格 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 周视图 / 年视图 占位 -->
  <div id="weekView" class="view-content" style="padding: 20px; text-align: center; color: #888;">
    周视图模块开发中...
  </div>
  <div id="yearView" class="view-content" style="padding: 20px; text-align: center; color: #888;">
    年视图模块开发中...
  </div>
</div>

<script>
  // 假定“今天”是 2026-09-24（符合系统当前环境）
  const TODAY = { year: 2026, month: 9, day: 24 };

  // 当前月视图显示的年月
  let displayYear = TODAY.year;
  let displayMonth = TODAY.month;

  // 事项数据
  let tasks = [
    { id: 1, title: '2个供应商...', isDone: false, dueDate: '2026-09-21', statusText: '今日到期 (2026-09-21)', type: 'due-today', dateNum: 21 },
    { id: 2, title: '163443...', isDone: false, dueDate: '2026-09-21', statusText: '今日到期 (2026-09-21)', type: 'due-today', dateNum: 21 },
    { id: 3, title: 'follow up e...', isDone: true, dueDate: '2026-09-22', statusText: '已完成 ✓', type: 'completed', dateNum: 22 },
    { id: 4, title: '163614 ar10 n...', isDone: false, dueDate: '2026-09-22', statusText: '今日到期 (2026-09-22)', type: 'due-today', dateNum: 22 },
    { id: 5, title: 'call供应商on s...', isDone: false, dueDate: '2026-09-25', statusText: '还剩 3 个工作日到期', type: 'upcoming', dateNum: 25 },
    { id: 6, title: '165717 cut ...', isDone: true, dueDate: '2026-09-23', statusText: '已完成 ✓', type: 'completed', dateNum: 23 }
  ];

  // 1. Tab 切换逻辑
  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

    if (tabName === 'followUp') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('followUpView').classList.add('active');
      renderTasks();
    } else if (tabName === 'week') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('weekView').classList.add('active');
    } else if (tabName === 'month') {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('monthView').classList.add('active');
      renderMonthView();
    } else if (tabName === 'year') {
      document.querySelectorAll('.tab-btn')[3].classList.add('active');
      document.getElementById('yearView').classList.add('active');
    }
  }

  // 2. 渲染 Follow Up 列表（已完成自动置底，字体已调小）
  function renderTasks() {
    const listContainer = document.getElementById('taskList');
    listContainer.innerHTML = '';

    // 核心逻辑：未完成在上面，完成的自动下沉到底部
    const sortedTasks = [...tasks].sort((a, b) => {
      if (a.isDone === b.isDone) return 0;
      return a.isDone ? 1 : -1;
    });

    sortedTasks.forEach(task => {
      const card = document.createElement('div');
      
      let cardClass = 'task-card ';
      if (task.isDone) {
        cardClass += 'completed';
      } else {
        cardClass += task.type || 'due-today';
      }
      card.className = cardClass;

      card.innerHTML = `
        <div class="drag-handle">☰</div>
        <div class="task-content">
          <div class="task-title" title="${task.title}">${task.title}</div>
          <div class="task-sub">${task.isDone ? '已完成 ✓' : task.statusText}</div>
        </div>
        <div class="action-btns">
          <button class="icon-btn" onclick="editTask(${task.id})" title="编辑">✏️</button>
          <button class="icon-btn" onclick="deleteTask(${task.id})" title="删除">🗑️</button>
          <button class="done-btn" onclick="toggleDone(${task.id})">
            ${task.isDone ? 'Done ✓' : 'Done'}
          </button>
        </div>
      `;

      listContainer.appendChild(card);
    });
  }

  // 切换完成状态
  function toggleDone(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.isDone = !task.isDone;
      renderTasks();
      renderMonthView();
    }
  }

  function addNewTask() {
    const input = document.getElementById('newTaskInput');
    const title = input.value.trim();
    if (!title) return;

    const newTask = {
      id: Date.now(),
      title: title,
      isDone: false,
      dueDate: `2026-09-24`,
      statusText: '今日到期 (2026-09-24)',
      type: 'due-today',
      dateNum: 24
    };

    tasks.unshift(newTask);
    input.value = '';
    renderTasks();
    renderMonthView();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    renderTasks();
    renderMonthView();
  }

  function editTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      const newTitle = prompt('修改事项名称：', task.title);
      if (newTitle !== null && newTitle.trim() !== '') {
        task.title = newTitle.trim();
        renderTasks();
        renderMonthView();
      }
    }
  }

  // 3. 渲染月视图
  function renderMonthView() {
    const titleElem = document.getElementById('monthDisplayTitle');
    const formattedMonth = displayMonth < 10 ? `0${displayMonth}` : displayMonth;
    titleElem.innerText = `${displayYear} 年 ${formattedMonth} 月`;

    const gridContainer = document.getElementById('calendarDaysGrid');
    gridContainer.innerHTML = '';

    // 生成工作日(周一至周五)的简易示范网格
    // 以2026年9月为例，从 1 号到 30 号
    const daysInMonth = new Date(displayYear, displayMonth, 0).getDate();

    for (let day = 1; day <= daysInMonth; day++) {
      // 过滤出工作日（模拟周一到周五）
      const dateObj = new Date(displayYear, displayMonth - 1, day);
      const dayOfWeek = dateObj.getDay();
      
      // 0是周日，6是周六，排除周末
      if (dayOfWeek === 0 || dayOfWeek === 6) continue;

      const cell = document.createElement('div');
      cell.className = 'day-cell';

      // 是否是今天
      if (displayYear === TODAY.year && displayMonth === TODAY.month && day === TODAY.day) {
        cell.classList.add('is-today');
      }

      let cellHTML = `<div class="day-number">${day}</div>`;

      // 匹配当天的任务标签（仅在2026年9月显示示例数据）
      if (displayYear === 2026 && displayMonth === 9) {
        const dayTasks = tasks.filter(t => t.dateNum === day);
        dayTasks.forEach(t => {
          let tagClass = 'tag-due';
          if (t.isDone) tagClass = 'tag-completed';
          else if (t.type === 'upcoming') tagClass = 'tag-upcoming';

          cellHTML += `<div class="calendar-tag ${tagClass}">${t.title}</div>`;
        });
      }

      cell.innerHTML = cellHTML;
      gridContainer.appendChild(cell);
    }
  }

  // 4. 月份翻页与快速回到本月
  function changeMonth(delta) {
    displayMonth += delta;
    if (displayMonth > 12) {
      displayMonth = 1;
      displayYear++;
    } else if (displayMonth < 1) {
      displayMonth = 12;
      displayYear--;
    }
    renderMonthView();
  }

  // 点击【本月】按钮一键回到当前月份
  function resetToCurrentMonth() {
    displayYear = TODAY.year;
    displayMonth = TODAY.month;
    renderMonthView();
  }

  // 页面加载完成初始化
  document.addEventListener('DOMContentLoaded', () => {
    renderTasks();
  });
</script>

</body>
</html>
