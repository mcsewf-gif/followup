<script>
/**
 * 绘制 512x512 高清 Follow up 图标 DataURI 并更新 App 图标和 Manifest
 * @param {Array} items - 待办事项数组，例如: [{ color: 'yellow' }, { color: 'red' }] 或包含 status/color 的对象
 */
function setupAppIcon(items = []) {
  // 1. 统计黄色和浅红色的项目数量
  // 支持判断 item.color（如 'yellow', 'lightred', 'red', '#fef08a' 等）或根据你的具体逻辑判断
  const pendingCount = items.filter(item => {
    if (!item) return false;
    const color = (item.color || item.status || '').toLowerCase();
    return color.includes('yellow') || 
           color.includes('red') || 
           color === '#fef08a' || // 常见黄色背景值
           color === '#fecaca';   // 常见浅红色背景值
  }).length;

  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  // ------------------ 绘制图标底座背景 ------------------
  ctx.fillStyle = '#4f46e5';
  ctx.beginPath();
  ctx.roundRect(0, 0, 512, 512, 100);
  ctx.fill();

  // ------------------ 绘制白色卡片纸张 ------------------
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(90, 80, 332, 352, 24);
  ctx.fill();

  // ------------------ 绘制 4 行待办图标样式 ------------------
  const lines = [150, 220, 290, 360];
  lines.forEach((y, i) => {
    ctx.fillStyle = i < 2 ? '#10b981' : '#cbd5e1';
    ctx.beginPath();
    ctx.roundRect(130, y, 32, 32, 6);
    ctx.fill();

    if (i < 2) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(136, y + 16);
      ctx.lineTo(144, y + 24);
      ctx.lineTo(156, y + 10);
      ctx.stroke();
    }

    ctx.fillStyle = i < 2 ? '#94a3b8' : '#475569';
    ctx.beginPath();
    ctx.roundRect(180, y + 8, 200, 16, 8);
    ctx.fill();
  });

  // ------------------ 绘制右上角小红点提醒角标 ------------------
  if (pendingCount > 0) {
    const badgeX = 412; // 红点中心 X 坐标
    const badgeY = 100; // 红点中心 Y 坐标
    const badgeRadius = 48; // 红点半径

    // 1. 绘制红底圆圈及白色外边框（提升图标上的对比度）
    ctx.fillStyle = '#ef4444';       // 红色背景
    ctx.strokeStyle = '#ffffff';     // 白色外描边
    ctx.lineWidth = 12;              // 描边粗细
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, badgeRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 2. 绘制数字提醒
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 52px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 如果数字大于 99，显示 99+
    const displayText = pendingCount > 99 ? '99+' : String(pendingCount);
    ctx.fillText(displayText, badgeX, badgeY + 2); // 稍微向下偏移 2px 以更好居中
  }

  // ------------------ 导出图像并设置 ------------------
  const iconDataUrl = canvas.toDataURL('image/png');

  // 更新 link 标签图标
  const iconPlaceholder = document.getElementById('apple-icon-placeholder');
  if (iconPlaceholder) {
    iconPlaceholder.href = iconDataUrl;
  }

  // 更新 Web App Manifest 配置
  const manifestObj = {
    name: "FollowUp",
    short_name: "FollowUp",
    start_url: ".",
    display: "standalone",
    background_color: "#f3f4f6",
    theme_color: "#4f46e5",
    icons: [{ src: iconDataUrl, sizes: "512x512", type: "image/png" }]
  };

  return iconDataUrl;
}

// ------------------ 使用示例 ------------------
// 传入当前 Follow up 项目列表（假设其中有两个黄色项目，一个浅红色项目）
const currentFollowUpItems = [
  { name: "项目1", color: "green" },     // 已完成
  { name: "项目2", color: "yellow" },    // 黄色（需跟进）
  { name: "项目3", color: "yellow" },    // 黄色（需跟进）
  { name: "项目4", color: "lightred" }   // 浅红色（超期/紧急）
];

// 调用函数（统计结果为 3，会自动在图标右上角生成带有数字 3 的小红点）
setupAppIcon(currentFollowUpItems);
</script>
